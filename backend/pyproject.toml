[project]
name = "nexusmayorista-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM"]
# N818 pide el sufijo "Error" en inglés; usamos nombres en castellano (ErrorAPI).
ignore = ["N818"]
# Los asserts son la forma normal de escribir tests con pytest.
per-file-ignores = { "tests/**" = ["S101", "S105", "S106"] }
